<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ErgoStudio 3D - Universal Parametric Generator</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    #viewport-container {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }
    #canvas3d {
      width: 100%;
      height: 100%;
      display: block;
    }
    #sidebar {
      width: 420px;
      background-color: #1e293b;
      border-left: 1px solid #334155;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 24px;
      gap: 16px;
    }
    .header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .dev-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: lowercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      background: rgba(15, 23, 42, 0.6);
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid #334155;
      width: fit-content;
    }
    .live-dot-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 8px;
      height: 8px;
    }
    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
    }
    .live-dot-ping {
      position: absolute;
      width: 100%;
      height: 100%;
      background-color: #22c55e;
      border-radius: 50%;
      animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
    }
    @keyframes ping {
      0% { transform: scale(1); opacity: 0.8; }
      75%, 100% { transform: scale(2.4); opacity: 0; }
    }
    .tool-selector {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tool-selector label {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .tool-selector select {
      background: #0f172a;
      border: 1px solid #475569;
      color: #38bdf8;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }
    optgroup {
      background: #1e293b;
      color: #94a3b8;
      font-weight: 700;
    }
    option {
      background: #0f172a;
      color: #f8fafc;
      font-weight: 500;
    }
    .preset-group {
      display: flex;
      gap: 6px;
    }
    .btn-preset {
      flex: 1;
      padding: 8px 4px;
      background: #334155;
      border: 1px solid #475569;
      color: #e2e8f0;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .btn-preset:hover {
      background: #475569;
      border-color: #38bdf8;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 500;
      color: #cbd5e1;
    }
    .control-label span {
      color: #38bdf8;
      font-weight: 600;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    .metrics-panel {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
    }
    .metric-row .label {
      color: #94a3b8;
    }
    .metric-row .val {
      font-weight: 600;
      color: #f1f5f9;
    }
    .metric-row .val.highlight {
      color: #4ade80;
    }
    .btn-download {
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
      margin-top: auto;
    }
    .btn-download:hover {
      background: #0369a1;
    }
    .instruction-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: #94a3b8;
      pointer-events: none;
    }
    @media (max-width: 768px) {
      body { flex-direction: column; }
      #sidebar { width: 100%; height: 55vh; }
      #viewport-container { height: 45vh; }
    }
  </style>
</head>
<body>

  <div id="viewport-container">
    <div class="instruction-badge" id="info-badge">Klik & seret untuk memutar 3D | Scroll untuk zoom</div>
    <canvas id="canvas3d"></canvas>
  </div>

  <div id="sidebar">
    <div class="header">
      <h1>ErgoStudio 3D</h1>
      <div class="dev-badge">
        <span class="live-dot-wrapper">
          <span class="live-dot-ping"></span>
          <span class="live-dot"></span>
        </span>
        <span>developer : fatur62</span>
      </div>
    </div>

    <div class="tool-selector">
      <label for="select-tool">Kategori & Pilihan Alat:</label>
      <select id="select-tool">
        <optgroup label="Alat Bantu Harian & Pekerja">
          <option value="lever">1. Tuas Pembuka Tutup Botol / Keran</option>
          <option value="grip">2. Selongsong Gagang Alat (Obeng/Sendok)</option>
          <option value="wedge">3. Baji Penyangga Pergelangan Tangan</option>
          <option value="key">4. Tuas Pemutar Anak Kunci Rumah</option>
          <option value="page">5. Penahan Halaman Buku (Ibu Jari)</option>
          <option value="pusher">6. Tuas Penekan Sakelar / Tombol</option>
        </optgroup>
        <optgroup label="Aksesoris & Adaptif Kendaraan">
          <option value="spinner">7. Knop Pemutar Setir Mobil (1 Tangan)</option>
          <option value="clamp">8. Klem Braket Setang Motor / Sepeda</option>
          <option value="stalk">9. Ekstensi Tuas Sein / Wiper Mobil</option>
        </optgroup>
      </select>
    </div>

    <div id="dynamic-controls" style="display: flex; flex-direction: column; gap: 14px;"></div>

    <div class="metrics-panel">
      <div class="metric-row">
        <span class="label" id="metric-label-benefit">Efek Ergonomis:</span>
        <span class="val highlight" id="metric-benefit">-</span>
      </div>
      <div class="metric-row">
        <span class="label">Estimasi Berat Filamen:</span>
        <span class="val" id="metric-weight">-</span>
      </div>
      <div class="metric-row">
        <span class="label">Rekomendasi Bahan:</span>
        <span class="val" id="metric-material">PLA+ / PETG</span>
      </div>
      <div class="metric-row">
        <span class="label">Estimasi Biaya Cetak:</span>
        <span class="val highlight" id="metric-cost">-</span>
      </div>
    </div>

    <button id="btn-export" class="btn-download">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Download File STL
    </button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('canvas3d');
      const container = document.getElementById('viewport-container');
      const selectTool = document.getElementById('select-tool');
      const dynamicControls = document.getElementById('dynamic-controls');
      const infoBadge = document.getElementById('info-badge');
      const metricLabelBenefit = document.getElementById('metric-label-benefit');
      const metricBenefit = document.getElementById('metric-benefit');
      const metricWeight = document.getElementById('metric-weight');
      const metricMaterial = document.getElementById('metric-material');
      const metricCost = document.getElementById('metric-cost');
      const btnExport = document.getElementById('btn-export');

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(50, 150, 200);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(20, 0, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(80, 200, 100);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.4);
      fillLight.position.set(-100, -100, -100);
      scene.add(fillLight);

      const grid = new THREE.GridHelper(350, 35, 0x334155, 0x1e293b);
      grid.position.set(20, -0.5, 0);
      scene.add(grid);

      const primaryMaterial = new THREE.MeshStandardMaterial({
        color: 0x0ea5e9,
        roughness: 0.35,
        metalness: 0.1
      });

      const helperMaterial = new THREE.MeshStandardMaterial({
        color: 0x64748b,
        roughness: 0.5,
        transparent: true,
        opacity: 0.45
      });

      let currentMesh = null;
      let referenceMesh = null;

      function clearMeshes() {
        if (currentMesh) {
          scene.remove(currentMesh);
          currentMesh.geometry.dispose();
          currentMesh = null;
        }
        if (referenceMesh) {
          scene.remove(referenceMesh);
          referenceMesh.geometry.dispose();
          referenceMesh = null;
        }
      }

      function updateMetricsDisplay(benefitLabel, benefitVal, grams, materialStr, pricePerGram = 500) {
        metricLabelBenefit.textContent = benefitLabel;
        metricBenefit.textContent = benefitVal;
        metricWeight.textContent = `${grams} g`;
        metricMaterial.textContent = materialStr;
        const total = Math.max(15000, Math.round((grams * pricePerGram) / 1000) * 1000);
        metricCost.textContent = `Rp ${total.toLocaleString('id-ID')}`;
      }

      // 1. TUAS PEMBUKA BOTOL & KERAN
      function renderLeverControls() {
        dynamicControls.innerHTML = `
          <div class="preset-group">
            <button class="btn-preset" data-d="30" data-l="110" data-t="10">Botol Air</button>
            <button class="btn-preset" data-d="45" data-l="140" data-t="12">Keran Air</button>
            <button class="btn-preset" data-d="70" data-l="175" data-t="15">Toples Selai</button>
          </div>
          <div class="control-group">
            <div class="control-label"><label>Diameter Tutup</label><span id="val-d">30 mm</span></div>
            <input type="range" id="param-d" min="20" max="85" step="1" value="30">
          </div>
          <div class="control-group">
            <div class="control-label"><label>Panjang Tuas</label><span id="val-l">110 mm</span></div>
            <input type="range" id="param-l" min="80" max="220" step="5" value="110">
          </div>
          <div class="control-group">
            <div class="control-label"><label>Ketebalan Alat</label><span id="val-t">10 mm</span></div>
            <input type="range" id="param-t" min="8" max="20" step="1" value="10">
          </div>
        `;
        const pD = document.getElementById('param-d');
        const pL = document.getElementById('param-l');
        const pT = document.getElementById('param-t');
        const vD = document.getElementById('val-d');
        const vL = document.getElementById('val-l');
        const vT = document.getElementById('val-t');

        function update() {
          const d = parseFloat(pD.value);
          const l = parseFloat(pL.value);
          const t = parseFloat(pT.value);
          vD.textContent = `${d} mm`;
          vL.textContent = `${l} mm`;
          vT.textContent = `${t} mm`;

          clearMeshes();
          const radius = d / 2;
          const outerHeadRadius = radius + 11;
          const handleEndWidth = 24;
          const teethCount = Math.max(16, Math.floor(d * 0.75));
          const toothDepth = 1.4;

          const shape = new THREE.Shape();
          const sinRatio = Math.min(0.95, (outerHeadRadius - handleEndWidth / 2) / l);
          const tangentAngle = Math.asin(sinRatio);
          const startArc = Math.PI / 2 + tangentAngle;
          const endArc = 3 * Math.PI / 2 - tangentAngle;

          shape.absarc(0, 0, outerHeadRadius, startArc, endArc, false);
          shape.lineTo(l, -handleEndWidth / 2);
          shape.absarc(l, 0, handleEndWidth / 2, -Math.PI / 2, Math.PI / 2, false);
          shape.lineTo(outerHeadRadius * Math.cos(startArc), outerHeadRadius * Math.sin(startArc));

          const hole = new THREE.Path();
          const samples = teethCount * 2;
          for (let i = 0; i <= samples; i++) {
            const theta = (i / samples) * Math.PI * 2;
            const r = (i % 2 === 1) ? radius - toothDepth : radius;
            const x = Math.cos(theta) * r;
            const y = Math.sin(theta) * r;
            if (i === 0) hole.moveTo(x, y);
            else hole.lineTo(x, y);
          }
          shape.holes.push(hole);

          const geom = new THREE.ExtrudeGeometry(shape, {
            steps: 1, depth: t, bevelEnabled: true, bevelThickness: 1.5, bevelSize: 1.2, bevelSegments: 3
          });

          currentMesh = new THREE.Mesh(geom, primaryMaterial);
          currentMesh.rotation.x = -Math.PI / 2;
          currentMesh.position.set(0, t, 0);
          scene.add(currentMesh);

          const capGeom = new THREE.CylinderGeometry(radius, radius, t + 12, 32);
          referenceMesh = new THREE.Mesh(capGeom, helperMaterial);
          referenceMesh.position.set(0, (t + 12) / 2 - 2, 0);
          scene.add(referenceMesh);

          const weight = Math.max(16, Math.round((((Math.PI * Math.pow(d / 20 + 1.1, 2) - Math.PI * Math.pow(d / 20, 2)) + (l / 10 * 2.2)) * (t / 10)) * 0.45 * 1.24));
          updateMetricsDisplay("Beban Putar:", `${Math.min(88, Math.round((1 - (d / (l * 1.6))) * 100))}% Lebih Ringan`, weight, "PLA+ / PETG");
          infoBadge.textContent = "Silinder abu-abu = Tutup yang dicengkeram | Tuas biru = Pengungkit";
        }

        [pD, pL, pT].forEach(el => el.addEventListener('input', update));
        dynamicControls.querySelectorAll('.btn-preset').forEach(btn => {
          btn.addEventListener('click', () => {
            pD.value = btn.dataset.d;
            pL.value = btn.dataset.l;
            pT.value = btn.dataset.t;
            update();
          });
        });
        update();
      }

      // 2. SELONGSONG GAGANG ERGONOMIS
      function renderGripControls() {
        dynamicControls.innerHTML = `
          <div class="preset-group">
            <button class="btn-preset" data-inner="8" data-outer="32" data-h="100">Pena / Kuas</button>
            <button class="btn-preset" data-inner="11" data-outer="38" data-h="110">Sendok Makan</button>
            <button class="btn-preset" data-inner="16" data-outer="42" data-h="120">Obeng / Alat</button>
          </div>
          <div class="control-group">
            <div class="control-label"><label>Diameter Alat Asli (Lubang)</label><span id="val-inner">11 mm</span></div>
            <input type="range" id="param-inner" min="5" max="25" step="1" value="11">
          </div>
          <div class="control-group">
            <div class="control-label"><label>Diameter Genggaman Luar</label><span id="val-outer">38 mm</span></div>
            <input type="range" id="param-outer" min="26" max="55" step="1" value="38">
          </div>
          <div class="control-group">
            <div class="control-label"><label>Panjang Gagang</label><span id="val-h">110 mm</span></div>
            <input type="range" id="param-h" min="70" max="150" step="5" value="110">
          </div>
        `;
        const pInner = document.getElementById('param-inner');
        const pOuter = document.getElementById('param-outer');
        const pH = document.getElementById('param-h');
        const vInner = document.getElementById('val-inner');
        const vOuter = document.getElementById('val-outer');
        const vH = document.getElementById('val-h');

        function update() {
          const innerD = parseFloat(pInner.value);
          const outerD = Math.max(innerD + 10, parseFloat(pOuter.value));
          const h = parseFloat(pH.value);
          pOuter.value = outerD;
          vInner.textContent = `${innerD} mm`;
          vOuter.textContent = `${outerD} mm`;
          vH.textContent = `${h} mm`;

          clearMeshes();
          const baseOuterR = outerD / 2;
          const innerR = innerD / 2;

          const shape = new THREE.Shape();
          shape.absarc(0, 0, baseOuterR, 0, Math.PI * 2, false);
          const hole = new THREE.Path();
          hole.absarc(0, 0, innerR, 0, Math.PI * 2, true);
          shape.holes.push(hole);

          const geom = new THREE.ExtrudeGeometry(shape, {
            steps: 20, depth: h, bevelEnabled: true, bevelThickness: 3, bevelSize: 2, bevelSegments: 4
          });

          currentMesh = new THREE.Mesh(geom, primaryMaterial);
          currentMesh.rotation.x = -Math.PI / 2;
          currentMesh.position.set(20, 0, 0);
          scene.add(currentMesh);

          const coreGeom = new THREE.CylinderGeometry(innerR, innerR, h + 30, 24);
          referenceMesh = new THREE.Mesh(coreGeom, helperMaterial);
          referenceMesh.position.set(20, (h + 30) / 2 - 15, 0);
          scene.add(referenceMesh);

          const volCm3 = ((Math.PI * Math.pow(outerD / 20, 2) - Math.PI * Math.pow(innerD / 20, 2)) * (h / 10)) * 0.4;
          const weight = Math.max(22, Math.round(volCm3 * 1.22));
          updateMetricsDisplay("Beban Jepitan Jari:", "Turun ~60% (Empuk)", weight, "TPU (Karet) / PLA", 600);
          infoBadge.textContent = "Batang abu-abu = Gagang alat asli | Selongsong biru = Adaptor empuk";
        }

        [pInner, pOuter, pH].forEach(el => el.addEventListener('input', update));
        dynamicControls.querySelectorAll('.btn-preset').forEach(btn => {
          btn.addEventListener('click', () => {
            pInner.value = btn.dataset.inner;
            pOuter.value = btn.dataset.outer;
            pH.value = btn.dataset.h;
            update();
          });
        });
        update();
      }

      // 3. BAJI PENYANGGA TANGAN
      function renderWedgeControls() {
        dynamicControls.innerHTML = `
          <div class="preset-group">
            <button class="btn-preset" data-ang="8" data-w="90" data-d="80">Mouse</button>
            <button class="btn-preset" data-ang="12" data-w="120" data-d="90">Keyboard</button>
            <button class="btn-preset" data-ang="18" data-w="110" data-d="100">Artritis</button>
          </div>
          <div class="control-group">
            <div class="control-label"><label>Sudut Kemiringan</label><span id="val-ang">12°</span></div>
            <input type="range" id="param-ang" min="5" max="25" step="1" value="12">
          </div>
          <div class="control-group">
            <div class="control-label"><label>Lebar Bantalan</label><span id="val-w">110 mm</span></div>
            <input type="range" id="param-w" min="70" max="160" step="5" value="110">
          </div>
          <div class="control-group">
            <div class="control-label"><label>Kedalaman Telapak</label><span id="val-dep">90 mm</span></div>
            <input type="range" id="param-dep" min="60" max="130" step="5" value="90">
          </div>
        `;
        const pAng = document.getElementById('param-ang');
        const pW = document.getElementById('param-w');
        const pDep = document.getElementById('param-dep');
        const vAng = document.getElementById('val-ang');
        const vW = document.getElementById('val-w');
        const vDep = document.getElementById('val-dep');

        function update() {
          const ang = parseFloat(pAng.value);
          const w = parseFloat(pW.value);
          const dep = parseFloat(pDep.value);
          vAng.textContent = `${ang} deg`;
          vW.textContent = `${w} mm`;
          vDep.textContent = `${dep} mm`;

          clearMeshes();
          const rad = (ang * Math.PI) / 180;
          const minH = 5;
          const maxH = minH + Math.tan(rad) * dep;

          const shape = new THREE.Shape();
          shape.moveTo(0, 0);
          shape.lineTo(dep, 0);
          shape.lineTo(dep, maxH);
          shape.lineTo(0, minH);
          shape.closePath();

          const geom = new THREE.ExtrudeGeometry(shape, {
            steps: 1, depth: w, bevelEnabled: true, bevelThickness: 2, bevelSize: 2, bevelSegments: 3
          });

          currentMesh = new THREE.Mesh(geom, primaryMaterial);
          currentMesh.rotation.y = Math.PI / 2;
          currentMesh.position.set(-w / 2 + 20, 0, dep / 2);
          scene.add(currentMesh);

          const volCm3 = ((minH + maxH) / 2 * dep * w / 1000) * 0.25;
          const weight = Math.max(30, Math.round(volCm3 * 1.24));
          updateMetricsDisplay("Saraf Kejepit:", "Bebas Tekanan Sendi", weight, "PLA+ / TPU");
          infoBadge.textContent = "Baji miring penyangga pergelangan tangan / pengatur sudut meja";
        }

        [pAng, pW, pDep].forEach(el => el.addEventListener('input', update));
        dynamicControls.querySelectorAll('.btn-preset').forEach(btn => {
          btn.addEventListener('click', () => {
            pAng.value = btn.dataset.ang;
            pW.value = btn.dataset.w;
            pDep.value = btn.dataset.dep;
            update();
          });
        });
        update();
      }

      // 4. TUAS PEMUTAR KUNCI
      function renderKeyControls() {
        dynamicControls.innerHTML = `
          <div class="preset-group">
            <button class="btn-preset" data-kw="24" data-l="85" data-t="10">Kunci Gembok</button>
            <button class="btn-preset" data-kw="28" data-l="100" data-t="12">Kunci Kamar</button>
            <button class="btn-preset" data-kw="34" data-l="120" data-t="14">Kunci Gerbang</button>
          </div>
          <div class="control-group">
            <div class="control-label"><label>Lebar Kepala Kunci Asli</label><span id="val-kw">28 mm</span></div>
            <input type="range" id="param-kw" min="18" max="40" step="1" value="28">

      // EXPORT BINARY STL UNIVERSAL
      function exportBinarySTL(geometry, filename = 'ergo-tool.stl') {
        const tempGeom = geometry.clone();
        tempGeom.center();
        const pos = tempGeom.attributes.position;
        const idx = tempGeom.index;

        const count = idx ? idx.count / 3 : pos.count / 3;
        const buffer = new ArrayBuffer(84 + (count * 50));
        const view = new DataView(buffer);

        const header = "Binary STL - ErgoStudio Multi-Tool Parametric Generator";
        for (let i = 0; i < 80; i++) {
          view.setUint8(i, i < header.length ? header.charCodeAt(i) : 0);
        }
        view.setUint32(80, count, true);

        let offset = 84;
        const vA = new THREE.Vector3();
        const vB = new THREE.Vector3();
        const vC = new THREE.Vector3();
        const cb = new THREE.Vector3();
        const ab = new THREE.Vector3();

        for (let i = 0; i < count; i++) {
          let i0 = i * 3, i1 = i * 3 + 1, i2 = i * 3 + 2;
          if (idx) {
            i0 = idx.getX(i0);
            i1 = idx.getX(i1);
            i2 = idx.getX(i2);
          }

          vA.fromBufferAttribute(pos, i0);
          vB.fromBufferAttribute(pos, i1);
          vC.fromBufferAttribute(pos, i2);

          cb.subVectors(vC, vB);
          ab.subVectors(vA, vB);
          cb.cross(ab).normalize();

          view.setFloat32(offset, cb.x, true); offset += 4;
          view.setFloat32(offset, cb.y, true); offset += 4;
          view.setFloat32(offset, cb.z, true); offset += 4;

          view.setFloat32(offset, vA.x, true); offset += 4;
          view.setFloat32(offset, vA.y, true); offset += 4;
          view.setFloat32(offset, vA.z, true); offset += 4;

          view.setFloat32(offset, vB.x, true); offset += 4;
          view.setFloat32(offset, vB.y, true); offset += 4;
          view.setFloat32(offset, vB.z, true); offset += 4;

          view.setFloat32(offset, vC.x, true); offset += 4;
          view.setFloat32(offset, vC.y, true); offset += 4;
          view.setFloat32(offset, vC.z, true); offset += 4;

          view.setUint16(offset, 0, true); offset += 2;
        }

        const blob = new Blob([buffer], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
      }

      // Router Switcher
      selectTool.addEventListener('change', (e) => {
        const val = e.target.value;
        if (val === 'lever') renderLeverControls();
        else if (val === 'grip') renderGripControls();
        else if (val === 'wedge') renderWedgeControls();
        else if (val === 'key') renderKeyControls();
        else if (val === 'page') renderPageControls();
        else if (val === 'pusher') renderPusherControls();
        else if (val === 'spinner') renderSpinnerControls();
        else if (val === 'clamp') renderClampControls();
        else if (val === 'stalk') renderStalkControls();
      });

      btnExport.addEventListener('click', () => {
        if (!currentMesh) return;
        const toolName = selectTool.value;
        exportBinarySTL(currentMesh.geometry, `ergo-${toolName}-${Date.now()}.stl`);
      });

      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }

      // Render awal
      renderLeverControls();
      animate();
    })();
  </script>
</body>
</html>
